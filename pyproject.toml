[project]
name = "tutor-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vicente Marçal", email = "vicente.marcal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
tutor-rag = "tutor_rag:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Lean starter set; widen as the codebase grows.
# E/F: pycodestyle + pyflakes · I: isort · UP: pyupgrade · B: flake8-bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tutor_rag"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
# Third-party libs without stubs go here, one at a time — never loosening the global config:
# [[tool.mypy.overrides]]
# module = ["some_package.*"]
# ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
